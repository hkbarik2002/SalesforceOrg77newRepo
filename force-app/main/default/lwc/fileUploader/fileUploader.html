<template>
    <lightning-card title="File Uploader" icon-name="standard:file">

        <!-- File Upload -->
        <div class="slds-p-around_medium">
            <lightning-file-upload label="Upload Files" name="fileUploader" record-id={recordId} multiple
                onuploadfinished={handleUploadFinished}>
            </lightning-file-upload>
        </div>

        <!-- Uploaded Files Datatable -->
        <template if:true={files}>
            <div class="slds-p-around_medium">
                <lightning-datatable key-field="id" data={files} columns={columns} hide-checkbox-column>
                </lightning-datatable>
            </div>
        </template>

    </lightning-card>
</template>
