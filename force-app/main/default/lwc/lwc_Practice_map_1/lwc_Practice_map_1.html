<template>
    <lightning-card title="Practice Map">
        <template if:true={Result}>
            <template for:each={Result} for:item="acc">
                <div key={acc.accountId}>
                    <h3 class="slds-text-heading_small">Account ID: {acc.accountId}</h3>
                    <h3 class="slds-text-heading_small">Name :{acc.accountName}</h3>
                    <!-- Contact Table -->
                    <template if:true={acc.contacts.length}>
                        <p class="slds-m-top_small"><strong>contacts</strong></p>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                                <tr>
                                    <th>Id</th>
                                    <th>Name</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={acc.contacts} for:item="con">
                                    <tr key={con.OwnerId}>
                                        <td>{con.Id}</td>
                                        <td>{con.Name}</td>
                                        <td>{con.Email}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                </div>
            </template>
        </template>
    </lightning-card>
</template>
