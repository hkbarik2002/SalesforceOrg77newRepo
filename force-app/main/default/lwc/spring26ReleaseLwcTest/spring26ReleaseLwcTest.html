<template>
    <lightning-card title="DynamicEventListener" icon-name="standard:logging">

        <div class="slds-var-p-around_medium">
            <lightning-button-group>
                <lightning-button label="Click Mode" onclick={setClickMode} variant={clickVariant}>
                </lightning-button>
                <lightning-button label="Hover Mode" onclick={setHoverMode} variant={hoverVariant}>
                </lightning-button>
            </lightning-button-group>
        </div>

        <div class="slds-var-p-around_medium">
        </div>

        <div class="slds-var-p-around_medium slds-text-color_weak">
            Current mode: <strong>{eventMode}</strong>
        </div>
    </lightning-card>
</template>
